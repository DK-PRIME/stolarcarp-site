<!doctype html>
<html lang="uk">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Харчування · STOLAR CARP
  </title>

  <link
    rel="stylesheet"
    href="assets/css/main.css"
  >

  <script
    defer
    src="assets/js/config.js"
  ></script>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
    }

    body{
      background:
        radial-gradient(
          circle at top,
          #111827 0,
          #020617 55%
        );

      color:#e5e7eb;
    }

    /* =====================================================
       PAGE
       ===================================================== */

    .ira-wrap{
      width:100%;
      max-width:1100px;

      margin:0 auto;

      padding:
        6px 5px 30px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .ira-head{
      padding:
        11px 12px;

      border:
        1px solid
        rgba(148,163,184,.28);

      border-radius:16px;

      background:
        rgba(15,23,42,.94);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);
    }

    .ira-title{
      margin:0;

      color:#facc15;

      font-size:1.28rem;

      line-height:1.15;

      font-weight:900;
    }

    .ira-sub{
      margin-top:7px;

      color:#cbd5e1;

      font-size:.88rem;

      line-height:1.35;
    }

    #competitionTitle{
      color:#f8fafc;

      font-weight:900;
    }

    #stageTitle{
      color:#cbd5e1;
    }

    .state{
      margin-top:8px;

      color:#94a3b8;

      font-size:.80rem;

      line-height:1.25;
    }

    .state.ok{
      color:#22c55e;
    }

    .state.err{
      color:#ef4444;
    }

    /* =====================================================
       CARD
       ===================================================== */

    .card{
      margin-top:7px;

      padding:5px;

      border:
        1px solid
        rgba(148,163,184,.28);

      border-radius:15px;

      background:
        rgba(15,23,42,.94);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);

      overflow:hidden;
    }

    .summary{
      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:8px;

      padding:
        5px 4px 8px;

      color:#cbd5e1;

      font-size:.76rem;
    }

    .summary strong{
      color:#facc15;

      font-size:.95rem;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-wrap{
      width:100%;

      overflow:hidden;
    }

    table{
      width:100%;

      border-collapse:
        collapse;

      table-layout:
        fixed;

      font-size:.68rem;
    }

    th,
    td{
      border:
        1px solid
        rgba(148,163,184,.25);

      padding:
        6px 1px;

      text-align:center;

      vertical-align:middle;

      overflow:hidden;
    }

    th{
      color:#facc15;

      background:
        rgba(2,6,23,.78);

      font-weight:900;

      white-space:nowrap;
    }

    td{
      background:
        rgba(2,6,23,.34);
    }

    /*
     * Сектор
     */
    th:nth-child(1),
    td:nth-child(1){
      width:8%;
    }

    /*
     * Команда / учасник
     */
    th:nth-child(2),
    td:nth-child(2){
      width:38%;
    }

    /*
     * 6 прийомів їжі
     */
    th:nth-child(n+3),
    td:nth-child(n+3){
      width:9%;
    }

    /* =====================================================
       SECTOR
       ===================================================== */

    .sector{
      color:#facc15;

      font-size:.78rem;

      font-weight:900;

      white-space:nowrap;
    }

    /* =====================================================
       TEAM / PARTICIPANT
       ===================================================== */

    .team{
      padding-left:5px;
      padding-right:3px;

      text-align:left;

      white-space:normal;

      overflow:visible;
    }

    .team-name{
      color:#f8fafc;

      font-size:.75rem;

      line-height:1.18;

      font-weight:900;

      overflow-wrap:anywhere;
    }

    /* =====================================================
       FOOD NOTE
       ===================================================== */

    /*
     * meal_ira.js уже створює:
     *
     * <div class="note">
     *   ⚠ текст побажання
     * </div>
     *
     * Тому Іра бачить побажання
     * прямо під командою / учасником.
     */

    .note{
      margin-top:4px;

      padding-top:4px;

      border-top:
        1px dashed
        rgba(250,204,21,.38);

      color:#facc15;

      font-size:.64rem;

      line-height:1.25;

      font-weight:800;

      white-space:normal;

      overflow-wrap:anywhere;
    }

    /* =====================================================
       TOTAL
       ===================================================== */

    tfoot td{
      padding-top:7px;
      padding-bottom:7px;

      color:#facc15;

      background:
        rgba(30,41,59,.98);

      font-weight:900;
    }

    .empty{
      padding:
        18px 5px;

      color:#94a3b8;

      font-size:.76rem;

      text-align:center;
    }

    /* =====================================================
       VERY SMALL PHONE
       ===================================================== */

    @media(max-width:370px){

      table{
        font-size:.61rem;
      }

      th,
      td{
        padding:
          5px 1px;
      }

      .team-name{
        font-size:.68rem;
      }

      .sector{
        font-size:.70rem;
      }

      .note{
        font-size:.58rem;
      }

      .ira-title{
        font-size:1.17rem;
      }
    }

  </style>

</head>

<body>

<main class="ira-wrap">

  <!-- ===================================================
       HEADER
       =================================================== -->

  <section class="ira-head">

    <h1 class="ira-title">
      🍽 Харчування
    </h1>

    <div class="ira-sub">

      <strong id="competitionTitle">
        STOLAR CARP
      </strong>

      <br>

      <span id="stageTitle">
        Очікую активне харчування…
      </span>

    </div>

    <div
      id="state"
      class="state"
    >
      Завантаження…
    </div>

  </section>


  <!-- ===================================================
       FOOD TABLE
       =================================================== -->

  <section
    id="content"
    class="card"
    hidden
  >

    <div class="summary">

      <span>

        Заявок:

        <strong id="orderCount">
          0
        </strong>

      </span>

      <span>
        LIVE
      </span>

    </div>

    <div class="table-wrap">

      <table>

        <colgroup>

          <!-- Сектор -->
          <col style="width:8%">

          <!-- Команда / учасник -->
          <col style="width:38%">

          <!-- Доба 1 -->
          <col style="width:9%">
          <col style="width:9%">
          <col style="width:9%">

          <!-- Доба 2 -->
          <col style="width:9%">
          <col style="width:9%">
          <col style="width:9%">

        </colgroup>

        <thead>

          <tr>

            <th>
              С
            </th>

            <th>
              Команда / учасник
            </th>

            <th>
              1О
            </th>

            <th>
              1В
            </th>

            <th>
              1С
            </th>

            <th>
              2О
            </th>

            <th>
              2В
            </th>

            <th>
              2С
            </th>

          </tr>

        </thead>

        <tbody id="mealBody">

          <tr>

            <td
              colspan="8"
              class="empty"
            >
              Завантаження…
            </td>

          </tr>

        </tbody>

        <tfoot id="mealFoot">
        </tfoot>

      </table>

    </div>

  </section>

</main>

     FIREBASE
     ===================================================== -->

<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"
></script>

></script>

<script

></script>


<!-- =====================================================
     STOLAR CARP FIREBASE
     ===================================================== -->

<script
  src="assets/js/firebase-init.js"
></script>

     ПАНІ ІРА • PUBLIC READ ONLY
     ===================================================== -->

  src="assets/js/meal_ira.js?v=20260917-5"
></script>

</body>

</html>
