<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Харчування · STOLAR CARP</title>

  <link
    rel="stylesheet"
    href="assets/css/main.css"
  />

  <script
    defer
    src="assets/js/config.js"
  ></script>

  <style>
    body{
      margin:0;
      background:
        radial-gradient(
          circle at top,
          #111827 0,
          #020617 55%
        );
      color:#e5e7eb;
    }

    .ira-wrap{
      width:min(
        1100px,
        calc(100% - 20px)
      );
      margin:0 auto;
      padding:18px 0 60px;
    }

    .ira-head{
      padding:18px;
      border:
        1px solid
        rgba(148,163,184,.28);
      border-radius:20px;
      background:
        rgba(15,23,42,.92);
      box-shadow:
        0 18px 45px
        rgba(0,0,0,.45);
    }

    .ira-title{
      margin:0;
      font-size:1.7rem;
      font-weight:900;
      color:#facc15;
    }

    .ira-sub{
      margin-top:6px;
      color:#cbd5e1;
      line-height:1.45;
    }

    .state{
      margin-top:12px;
      font-size:.95rem;
      color:#94a3b8;
    }

    .state.ok{
      color:#22c55e;
    }

    .state.err{
      color:#ef4444;
    }

    .login-link{
      display:inline-flex;
      margin-top:14px;
      padding:10px 14px;
      border-radius:12px;
      text-decoration:none;
      font-weight:800;
      color:#111827;
      background:
        linear-gradient(
          135deg,
          #facc15,
          #f97316
        );
    }

    .card{
      margin-top:14px;
      padding:10px;
      border-radius:20px;
      border:
        1px solid
        rgba(148,163,184,.28);
      background:
        rgba(15,23,42,.92);
      box-shadow:
        0 18px 45px
        rgba(0,0,0,.45);
      overflow:hidden;
    }

    .summary{
      display:flex;
      align-items:center;
      justify-content:
        space-between;
      gap:12px;
      padding:8px 6px 14px;
      color:#cbd5e1;
    }

    .summary strong{
      color:#facc15;
    }

    .table-wrap{
      overflow-x:auto;
      -webkit-overflow-scrolling:
        touch;
    }

    table{
      width:100%;
      min-width:680px;
      border-collapse:
        collapse;
      table-layout:fixed;
      font-size:.88rem;
    }

    th,
    td{
      border:
        1px solid
        rgba(148,163,184,.22);
      padding:8px 6px;
      text-align:center;
      vertical-align:middle;
    }

    th{
      color:#facc15;
      font-weight:900;
      background:
        rgba(2,6,23,.68);
    }

    td{
      background:
        rgba(2,6,23,.34);
    }

    th:nth-child(1),
    td:nth-child(1){
      width:62px;
    }

    th:nth-child(2),
    td:nth-child(2){
      width:270px;
    }

    th:nth-child(n+3),
    td:nth-child(n+3){
      width:58px;
    }

    .sector{
      color:#facc15;
      font-weight:900;
      font-size:1rem;
    }

    .team{
      text-align:left;
      white-space:normal;
    }

    .team-name{
      color:#f8fafc;
      font-weight:800;
    }

    .note{
      margin-top:5px;
      color:#facc15;
      font-size:.82rem;
      line-height:1.3;
      font-weight:700;
    }

    tfoot td{
      color:#facc15;
      font-weight:900;
      background:
        rgba(30,41,59,.95);
    }

    .empty{
      padding:24px;
      color:#94a3b8;
      text-align:center;
    }

    @media(max-width:700px){

      .ira-wrap{
        width:min(
          100% - 12px,
          1100px
        );
        padding-top:10px;
      }

      .ira-head{
        padding:14px;
        border-radius:16px;
      }

      .ira-title{
        font-size:1.35rem;
      }

      .card{
        padding:6px;
        border-radius:16px;
      }

      table{
        font-size:.78rem;
      }

      th,
      td{
        padding:7px 4px;
      }
    }
  </style>
</head>

<body>

<main class="ira-wrap">

  <section class="ira-head">

    <h1 class="ira-title">
      🍽 Харчування
    </h1>

    <div class="ira-sub">

      <strong id="competitionTitle">
        STOLAR CARP
      </strong>

      <br>

      <span id="stageTitle">
        Завантаження…
      </span>

    </div>

    <div
      id="state"
      class="state"
    >
      Перевіряю доступ…
    </div>

    <a
      id="loginLink"
      class="login-link"
      href="auth.html"
      hidden
    >
      Увійти в STOLAR CARP
    </a>

  </section>

  <section
    id="content"
    class="card"
    hidden
  >

    <div class="summary">

      <span>
        Заявок:
        <strong id="orderCount">
          0
        </strong>
      </span>

      <span>
        Сектори оновлюються
        після жеребкування
      </span>

    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>С</th>
            <th>
              Команда / побажання
            </th>
            <th>1О</th>
            <th>1В</th>
            <th>1С</th>
            <th>2О</th>
            <th>2В</th>
            <th>2С</th>
          </tr>
        </thead>

        <tbody id="mealBody">

          <tr>
            <td
              colspan="8"
              class="empty"
            >
              Завантаження…
            </td>
          </tr>

        </tbody>

        <tfoot id="mealFoot">
        </tfoot>

      </table>

    </div>

  </section>

</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="assets/js/firebase-init.js"></script>

<script src="assets/js/meal_ira.js?v=20260917-1"></script>

</body>
</html>
