<!doctype html>

<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>STOLAR CARP • Адмінка</title>

  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    /* ============================================
       БАЗОВІ НАЛАШТУВАННЯ
       ============================================ */
    body {
      background: radial-gradient(circle at top, #111827 0, #020617 55%);
    }

    .admin-wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 22px 0 70px;
    }

    /* ============================================
       ХЕДЕР (FIX для "SC")
       ============================================ */
    .header .header__row {
      align-items: center;
    }

    .header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 8px 0;
    }

    .header .logo__mark {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      overflow: visible;
      padding: 0;
    }

    .header .logo__text {
      line-height: 1.1;
    }

    .header,
    .header .container {
      overflow: visible;
    }

    /* ============================================
       КНОПКА ВИХОДУ В ХЕДЕРІ
       ============================================ */
    .header-logout {
      margin-left: auto;
      margin-right: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .6);
      background: rgba(15, 23, 42, .9);
      color: #e5e7eb;
      font-size: .85rem;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .header-logout:hover {
      border-color: #facc15;
      color: #facc15;
    }

    /* ============================================
       КАРТКИ
       ============================================ */
    .admin-top {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(15, 23, 42, .9);
      border: 1px solid rgba(148, 163, 184, .35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
    }

    .admin-card {
      margin-top: 14px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(15, 23, 42, .9);
      border: 1px solid rgba(148, 163, 184, .35);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
    }

    /* ============================================
       ТИПОГРАФІКА ТА ДОПОМІЖНІ КЛАСИ
       ============================================ */
    .muted {
      color: #9ca3af;
    }

    .hidden {
      display: none !important;
    }

    .ok {
      color: #22c55e;
    }

    .err {
      color: #ef4444;
    }

    .hr {
      height: 1px;
      background: rgba(148, 163, 184, .18);
      margin: 12px 0;
      border-radius: 99px;
    }

    /* ============================================
       СТЕК КНОПОК
       ============================================ */
    .stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stack .btn {
      width: 100%;
      justify-content: center;
      padding: 12px 14px;
      border-radius: 14px;
    }

    /* ============================================
       ЛОГІН
       ============================================ */
    .login-card {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(145deg, #14141d, #08080d);
      border: 1px solid #262636;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .6);
    }

    .login-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pill {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .25);
      background: rgba(2, 6, 23, .35);
      color: #e5e7eb;
      font-weight: 700;
    }

    .pill--active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #000;
      border-color: transparent;
    }

    .login-title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: .04em;
      margin: 6px 0;
    }

    .login-sub {
      color: #9ca3af;
      margin-bottom: 14px;
    }

    /* ============================================
       ПОЛЯ ВВОДУ
       ============================================ */
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: .9rem;
      color: #cbd5e1;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, .25);
      background: rgba(2, 6, 23, .45);
      color: #e5e7eb;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(246, 195, 76, .25);
    }

    .login-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .login-actions .btn {
      border-radius: 14px;
      padding: 12px 14px;
    }

    /* ============================================
       МІНІ-ФОРМИ
       ============================================ */
    .mini-form {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .mini-form input,
    .mini-form select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, .35);
      background: rgba(2, 6, 23, .55);
      color: #e5e7eb;
      outline: none;
    }

    .mini-form input::placeholder {
      color: #6b7280;
    }

    /* ============================================
       СІТКА
       ============================================ */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 640px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    /* ============================================
       КАРТКИ ПЕРЕМОЖЦІВ
       ============================================ */
    .win-card {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, .25);
      background: rgba(2, 6, 23, .35);
      margin-top: 10px;
    }

    .win-title {
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: .85rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .badge {
      font-size: .72rem;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, .25);
      background: rgba(2, 6, 23, .45);
      color: #e5e7eb;
      white-space: nowrap;
    }

    .badge--final {
      background: linear-gradient(135deg, #f6c34c, #d6a23a, #7a0f2b);
      border-color: transparent;
      color: #000;
      font-weight: 900;
    }

    /* ============================================
       НОТАТКИ
       ============================================ */
    .note {
      font-size: .82rem;
      color: #9ca3af;
      line-height: 1.35;
    }

    .note b {
      color: #e5e7eb;
    }
  </style>
</head>

<body>

  <!-- ============================================
       ХЕДЕР
       ============================================ -->
  <header class="header">
    <div class="container header__row">

      <a class="logo" href="index.html">
        <span class="logo__mark">SC</span>
        <span class="logo__text">STOLAR CARP</span>
      </a>

      <nav class="nav">
        <a href="live.html" class="nav__link">Live</a>
        <a href="rating.html" class="nav__link">Рейтинг</a>
        <a href="auth.html" class="nav__link">Акаунт</a>
      </nav>

      <button
        class="header-logout"
        id="btnAdminLogout"
        type="button"
        title="Вийти з адмінки"
      >
        Вийти
      </button>

    </div>
  </header>

  <!-- ============================================
       ГОЛОВНИЙ КОНТЕНТ
       ============================================ -->
  <main class="main">
    <section class="section container admin-wrap">

      <!-- Шапка статусу -->
      <div class="admin-top">

        <div
          class="title-gradient"
          style="font-size:1.2rem; font-weight:900;"
        >
          Адмінка STOLAR CARP
        </div>

        <div class="muted" id="adminStatus">
          Запуск…
        </div>

        <div
          class="muted"
          id="adminDebug"
          style="margin-top:6px;"
        ></div>

      </div>

      <!-- Форма входу -->
      <div id="adminLogin" class="admin-card hidden">
        <div class="login-card">

          <div class="login-tabs">
            <div class="pill pill--active">
              Вхід
            </div>
          </div>

          <div class="login-title">
            Вхід адміністратора
          </div>

          <div class="login-sub">
            Вхід тільки для адміністратора (email/пароль).
          </div>

          <div class="field">
            <label for="admEmail">
              Email
            </label>

            <input
              id="admEmail"
              type="email"
              placeholder="Email адміністратора"
              autocomplete="username"
            >
          </div>

          <div class="field">
            <label for="admPass">
              Пароль
            </label>

            <input
              id="admPass"
              type="password"
              placeholder="Пароль адміністратора"
              autocomplete="current-password"
            >
          </div>

          <div class="login-actions">
            <button
              class="btn btn--accent"
              id="btnAdminLogin"
              type="button"
            >
              Увійти
            </button>
          </div>

          <div
            class="muted"
            id="adminLoginMsg"
            style="margin-top:10px;"
          ></div>

        </div>
      </div>

      <!-- Головне меню після входу -->
      <div id="adminApp" class="hidden">
        <div class="admin-card">
          <div class="stack">

            <a
              class="btn btn--primary"
              href="admin-create.html?type=season"
            >
              1) Створити сезон STOLAR CARP
            </a>

            <a
              class="btn btn--accent"
              href="admin-create.html?type=oneoff"
            >
              2) Створити одиночне змагання
            </a>

            <a
              class="btn btn--primary"
              href="admin-registrations.html"
            >
              3) Реєстрація команд
            </a>

            <a
              class="btn btn--accent"
              href="admin-draw.html"
            >
              4) Жеребкування
            </a>

            <a
              class="btn btn--danger"
              href="admin-weigh.html"
            >
              5) Зважування (адмін)
            </a>

            <a
              class="btn btn--primary"
              href="admin-accounts.html"
            >
              6) Акаунт STOLAR CARP
            </a>

            <a
              class="btn btn--accent"
              href="judge_qr_admin.html"
            >
              📱 QR-доступ для суддів
            </a>

          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- ============================================
       FIREBASE
       ============================================ -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="assets/js/firebase-init.js"></script>

  <!-- Основна логіка адмінки -->
  <script src="assets/js/admin.js?v=20260801"></script>

</body>
</html>
