<!doctype html>
<html lang="uk">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Харчування · STOLAR CARP
  </title>

  <link
    rel="stylesheet"
    href="assets/css/main.css"
  >

  <script
    defer
    src="assets/js/config.js"
  ></script>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
    }

    body{
      background:
        radial-gradient(
          circle at top,
          #111827 0,
          #020617 55%
        );

      color:#e5e7eb;
    }

    .ira-wrap{
      width:100%;
      max-width:1100px;

      margin:0 auto;

      padding:
        6px 5px 30px;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    .ira-head{
      padding:
        11px 12px;

      border:
        1px solid
        rgba(148,163,184,.28);

      border-radius:16px;

      background:
        rgba(15,23,42,.94);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);
    }

    .ira-title{
      margin:0;

      color:#facc15;

      font-size:1.28rem;

      line-height:1.15;

      font-weight:900;
    }

    .ira-sub{
      margin-top:7px;

      color:#cbd5e1;

      font-size:.88rem;

      line-height:1.35;
    }

    #competitionTitle{
      color:#f8fafc;

      font-weight:900;
    }

    #stageTitle{
      color:#cbd5e1;
    }

    .state{
      margin-top:8px;

      color:#94a3b8;

      font-size:.80rem;

      line-height:1.25;
    }

    .state.ok{
      color:#22c55e;
    }

    .state.err{
      color:#ef4444;
    }

    /* =====================================================
       PRICE PANEL
       ===================================================== */

    .price-card{
      margin-top:7px;

      padding:8px;

      border:
        1px solid
        rgba(250,204,21,.28);

      border-radius:15px;

      background:
        rgba(15,23,42,.94);
    }

    .price-title{
      margin-bottom:7px;

      color:#facc15;

      font-size:.82rem;

      font-weight:900;
    }

    .price-days{
      display:grid;

      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap:6px;
    }

    .price-day{
      padding:6px;

      border:
        1px solid
        rgba(148,163,184,.20);

      border-radius:11px;

      background:
        rgba(2,6,23,.32);
    }

    .price-day-title{
      margin-bottom:5px;

      color:#cbd5e1;

      font-size:.70rem;

      font-weight:900;
    }

    .price-grid{
      display:grid;

      grid-template-columns:
        repeat(3, minmax(0,1fr));

      gap:4px;
    }

    .price-field{
      min-width:0;
    }

    .price-field label{
      display:block;

      margin-bottom:2px;

      color:#94a3b8;

      font-size:.58rem;

      font-weight:800;

      text-align:center;
    }

    .ira-price-input{
      width:100%;

      height:30px;

      padding:
        2px 3px;

      border:
        1px solid
        rgba(148,163,184,.35);

      border-radius:7px;

      outline:none;

      background:#0f172a;

      color:#facc15;

      font-size:.72rem;

      font-weight:900;

      text-align:center;
    }

    .ira-price-input:focus{
      border-color:#facc15;
    }

    /* =====================================================
       TABLE CARD
       ===================================================== */

    .card{
      margin-top:7px;

      padding:5px;

      border:
        1px solid
        rgba(148,163,184,.28);

      border-radius:15px;

      background:
        rgba(15,23,42,.94);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.35);

      overflow:hidden;
    }

    .summary{
      display:flex;

      align-items:center;

      justify-content:
        space-between;

      gap:6px;

      padding:
        5px 4px 8px;

      color:#cbd5e1;

      font-size:.72rem;
    }

    .summary strong{
      color:#facc15;
    }

    #moneyTotal{
      color:#22c55e;

      font-weight:900;
    }

    /* =====================================================
       TABLE
       ===================================================== */

    .table-wrap{
      width:100%;

      overflow:hidden;
    }

    table{
      width:100%;

      border-collapse:
        collapse;

      table-layout:
        fixed;

      font-size:.62rem;
    }

    th,
    td{
      border:
        1px solid
        rgba(148,163,184,.25);

      padding:
        5px 1px;

      text-align:center;

      vertical-align:middle;

      overflow:hidden;
    }

    th{
      color:#facc15;

      background:
        rgba(2,6,23,.78);

      font-weight:900;

      white-space:nowrap;
    }

    td{
      background:
        rgba(2,6,23,.34);
    }

    .sector{
      color:#facc15;

      font-size:.70rem;

      font-weight:900;
    }

    .team{
      padding-left:4px;
      padding-right:2px;

      text-align:left;

      white-space:normal;

      overflow:visible;
    }

    .team-name{
      color:#f8fafc;

      font-size:.69rem;

      line-height:1.15;

      font-weight:900;

      overflow-wrap:anywhere;
    }

    .note{
      margin-top:4px;

      padding-top:3px;

      border-top:
        1px dashed
        rgba(250,204,21,.38);

      color:#facc15;

      font-size:.57rem;

      line-height:1.2;

      font-weight:800;

      white-space:normal;

      overflow-wrap:anywhere;
    }

    /* =====================================================
       EXTRA
       ===================================================== */

    .ira-extra-input{
      width:100%;

      min-width:0;

      height:27px;

      padding:
        1px 2px;

      border:
        1px solid
        rgba(148,163,184,.35);

      border-radius:6px;

      outline:none;

      background:#0f172a;

      color:#f8fafc;

      font-size:.62rem;

      font-weight:800;

      text-align:center;
    }

    .ira-extra-input:focus{
      border-color:#facc15;
    }

    .row-money{
      color:#22c55e;

      font-size:.65rem;

      font-weight:900;

      white-space:nowrap;
    }

    tfoot td{
      color:#facc15;

      background:
        rgba(30,41,59,.98);

      font-weight:900;
    }

    .empty{
      padding:
        18px 5px;

      color:#94a3b8;

      font-size:.76rem;

      text-align:center;
    }

    @media(max-width:370px){

      table{
        font-size:.56rem;
      }

      th,
      td{
        padding:
          4px 1px;
      }

      .team-name{
        font-size:.63rem;
      }

      .note{
        font-size:.53rem;
      }

      .ira-extra-input{
        font-size:.56rem;
      }

      .row-money{
        font-size:.58rem;
      }
    }

  </style>

</head>

<body>

<main class="ira-wrap">

  <section class="ira-head">

    <h1 class="ira-title">
      🍽 Харчування
    </h1>

    <div class="ira-sub">

      <strong id="competitionTitle">
        STOLAR CARP
      </strong>

      <br>

      <span id="stageTitle">
        Очікую активне харчування…
      </span>

    </div>

    <div
      id="state"
      class="state"
    >
      Завантаження…
    </div>

  </section>


  <!-- ===================================================
       ЦІНИ
       =================================================== -->

  <section
    id="priceCard"
    class="price-card"
    hidden
  >

    <div class="price-title">
      💰 Ціна харчування, грн
    </div>

    <div class="price-days">

      <div class="price-day">

        <div class="price-day-title">
          Доба 1
        </div>

        <div class="price-grid">

          <div class="price-field">
            <label>Обід</label>

            <input
              id="priceD1Lunch"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

          <div class="price-field">
            <label>Вечеря</label>

            <input
              id="priceD1Dinner"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

          <div class="price-field">
            <label>Сніданок</label>

            <input
              id="priceD1Breakfast"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

        </div>

      </div>


      <div class="price-day">

        <div class="price-day-title">
          Доба 2
        </div>

        <div class="price-grid">

          <div class="price-field">
            <label>Обід</label>

            <input
              id="priceD2Lunch"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

          <div class="price-field">
            <label>Вечеря</label>

            <input
              id="priceD2Dinner"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

          <div class="price-field">
            <label>Сніданок</label>

            <input
              id="priceD2Breakfast"
              class="ira-price-input"
              type="number"
              inputmode="decimal"
              min="0"
              step="1"
              placeholder="0"
            >
          </div>

        </div>

      </div>

    </div>

  </section>


  <!-- ===================================================
       ТАБЛИЦЯ
       =================================================== -->

  <section
    id="content"
    class="card"
    hidden
  >

    <div class="summary">

      <span>
        Заявок:
        <strong id="orderCount">
          0
        </strong>
      </span>

      <span>
        Всього:
        <strong id="moneyTotal">
          0 ₴
        </strong>
      </span>

      <span>
        LIVE
      </span>

    </div>

    <div class="table-wrap">

      <table>

        <colgroup>

          <col style="width:7%">

          <col style="width:29%">

          <col style="width:6.5%">
          <col style="width:6.5%">
          <col style="width:6.5%">

          <col style="width:6.5%">
          <col style="width:6.5%">
          <col style="width:6.5%">

          <col style="width:12%">

          <col style="width:13%">

        </colgroup>

        <thead>

          <tr>

            <th>
              С
            </th>

            <th>
              Учасник
            </th>

            <th>
              1О
            </th>

            <th>
              1В
            </th>

            <th>
              1С
            </th>

            <th>
              2О
            </th>

            <th>
              2В
            </th>

            <th>
              2С
            </th>

            <th>
              Доп.
            </th>

            <th>
              Σ
            </th>

          </tr>

        </thead>

        <tbody id="mealBody">

          <tr>

            <td
              colspan="10"
              class="empty"
            >
              Завантаження…
            </td>

          </tr>

        </tbody>

        <tfoot id="mealFoot">
        </tfoot>

      </table>

    </div>

  </section>

</main>


<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"
></script>

<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"
></script>

<script
  src="assets/js/firebase-init.js"
></script>

<script
  src="assets/js/meal_ira.js?v=20260917-6"
></script>

</body>

</html>
