  <style>
    /* =========================================================
       STOLAR CARP • PARTICIPATION
       COMPACT MOBILE DESIGN
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body.participation-page {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      color: #e5e7eb;
    }

    /* =========================================================
       STANDARD HEADER
       ========================================================= */

    .participation-page .header {
      position: sticky;
      top: 0;
      z-index: 100;

      padding: 0;

      background: rgba(2, 6, 23, .94);
      border-bottom: 1px solid rgba(148, 163, 184, .12);

      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .participation-page .header .header__row {
      align-items: center;
    }

    .participation-page .header .logo {
      display: flex;
      align-items: center;
      gap: 10px;

      min-height: 56px;
      padding: 8px 0;

      text-decoration: none;
    }

    .participation-page .header .logo__mark {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 12px;
    }

    .participation-page .header .logo__text {
      white-space: nowrap;
    }

    /* =========================================================
       MAIN WRAPPER
       ========================================================= */

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 12px 55px;
    }

    /* =========================================================
       BACK BUTTON
       ========================================================= */

    .backRow {
      display: flex;
      align-items: center;
      justify-content: flex-start;

      margin-bottom: 10px;
    }

    .btnBack {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      padding: 8px 13px;
      min-height: 36px;

      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, .22);

      background: rgba(15, 23, 42, .65);
      color: #e5e7eb;

      text-decoration: none;
      font-size: 12px;
      font-weight: 800;

      transition:
        background .2s ease,
        border-color .2s ease;
    }

    .btnBack:hover {
      background: rgba(30, 41, 59, .85);
      border-color: rgba(250, 204, 21, .35);
    }

    /* =========================================================
       TITLE
       ========================================================= */

    .pageTitle {
      margin: 9px 0 3px;

      text-align: center;

      font-weight: 950;
      letter-spacing: .3px;
      line-height: 1.15;
      font-size: 1.45rem;

      background: linear-gradient(
        90deg,
        #facc15 0%,
        #7f1d1d 100%
      );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .pageSub {
      text-align: center;

      color: #94a3b8;

      font-weight: 800;
      font-size: 12px;

      margin-bottom: 6px;
    }

    .pageSub:empty {
      display: none;
    }

    /* =========================================================
       PARTICIPANTS LIST
       ========================================================= */

    .list {
      margin-top: 4px;

      display: flex;
      flex-direction: column;

      gap: 0;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px 6px;
      min-height: 38px;

      border-bottom: 1px solid rgba(148, 163, 184, .13);
      border-radius: 5px;

      cursor: pointer;

      transition: background .2s;
    }

    .row:hover {
      background: rgba(250, 204, 21, .05);
    }

    .lamp {
      width: 8px;
      height: 8px;

      border-radius: 999px;

      flex: 0 0 8px;

      box-shadow: 0 0 0 2px rgba(255, 255, 255, .03);
    }

    .lamp--green {
      background: #22c55e;
    }

    .lamp--red {
      background: #ef4444;
    }

    .idx {
      width: 25px;
      flex: 0 0 25px;

      text-align: right;

      color: #94a3b8;

      font-weight: 900;
      font-size: 13px;
    }

    .name {
      flex: 1;
      min-width: 0;

      color: #e5e7eb;

      font-weight: 850;
      font-size: 13px;
      line-height: 1.25;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      flex: 0 0 auto;

      font-weight: 900;
      font-size: 11px;

      white-space: nowrap;

      color: #94a3b8;
    }

    .status--paid {
      color: #22c55e;
    }

    .status--unpaid {
      color: #ef4444;
    }

    .mutedCenter {
      text-align: center;

      color: #94a3b8;

      font-weight: 800;
      font-size: 13px;

      margin-top: 10px;
    }

    .dividerLabel {
      margin-top: 12px;
      padding: 7px 4px 5px;

      color: #facc15;

      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .07em;
      font-size: 11px;

      border-bottom: 1px solid rgba(250, 204, 21, .25);
    }

    /* =========================================================
       MEAL OPEN
       ========================================================= */

    .mealOpenWrap {
      display: flex;
      justify-content: center;

      margin: 7px 0 9px;
    }

    .mealOpenBtn {
      width: 100%;
      max-width: 420px;

      border: none;
      border-radius: 12px;

      padding: 10px 14px;

      font-weight: 950;
      font-size: 13px;

      cursor: pointer;

      color: #111827;

      background: linear-gradient(
        90deg,
        #facc15,
        #f97316
      );

      box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
    }

    /* =========================================================
       MEAL BOX
       ========================================================= */

    .mealBox {
      margin: 6px 0 9px;
      padding: 10px;

      border-radius: 13px;
      border: 1px solid rgba(250, 204, 21, .35);

      background:
        radial-gradient(
          circle at top left,
          rgba(250, 204, 21, .10),
          transparent 38%
        ),
        rgba(15, 23, 42, .65);

      box-shadow: 0 8px 22px rgba(0, 0, 0, .25);
    }

    .mealHead {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;

      margin-bottom: 0;
    }

    .mealTitle {
      font-weight: 950;
      color: #facc15;

      letter-spacing: .03em;
      font-size: 14px;
    }

    .mealActions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .mealBtn {
      border: 1px solid rgba(148, 163, 184, .24);

      background: #0f172a;
      color: #e5e7eb;

      border-radius: 10px;
      padding: 8px 10px;

      font-weight: 900;
      font-size: 12px;

      min-height: 34px;

      cursor: pointer;
    }

    .mealBtn--primary {
      border: none;

      background: linear-gradient(
        90deg,
        #facc15,
        #f97316
      );

      color: #111827;
    }

    .mealBtn--danger {
      border: none;

      background: linear-gradient(
        90deg,
        #ef4444,
        #991b1b
      );

      color: #fff;
    }

    [hidden],
    .mealBtn[hidden],
    .mealBox[hidden],
    .mealOpenWrap[hidden] {
      display: none !important;
    }

    .mealStatus {
      color: #94a3b8;

      font-size: 11px;

      margin-top: 4px;
      min-height: 0;

      line-height: 1.3;
    }

    .mealStatus:empty {
      display: none;
    }

    .mealStatus.ok {
      color: #22c55e;
    }

    .mealStatus.err {
      color: #ef4444;
    }

    /* =========================================================
       MEAL POPUP
       ========================================================= */

    #mealPopup {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .92);

      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);

      z-index: 10000;

      align-items: center;
      justify-content: center;

      padding: 4px;
    }

    #mealPopupContent {
      width: 100%;
      max-width: 100%;
      max-height: 96vh;

      overflow: auto;

      background: #0f172a;

      border: 1px solid #1f2937;
      border-radius: 12px;

      box-shadow: 0 26px 70px rgba(0, 0, 0, .75);
    }

    #mealPopupHeader {
      position: sticky;
      top: 0;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 8px 10px;

      border-bottom: 1px solid #1f2937;

      background: #0f172a;
    }

    #mealPopupTitle {
      color: #facc15;

      font-weight: 950;
      font-size: .9rem;
    }

    #mealPopupClose {
      background: none;
      border: none;

      color: #94a3b8;

      font-size: 1.35rem;

      cursor: pointer;

      width: 30px;
      height: 30px;

      border-radius: 10px;
    }

    #mealPopupClose:hover {
      background: #1f2937;
      color: #e5e7eb;
    }

    #mealPopupBody {
      padding: 4px;
    }

    .mealGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: 10px;

      margin: 10px 0 14px;
    }

    .mealField {
      background: #020617;

      border: 1px solid #1f2937;
      border-radius: 14px;

      padding: 10px;
    }

    .mealField label {
      display: block;

      color: #94a3b8;

      font-size: .8rem;
      margin-bottom: 6px;

      font-weight: 800;
    }

    .mealField input,
    .mealField textarea {
      width: 100%;

      background: #0b1220;

      border: 1px solid #374151;
      border-radius: 12px;

      color: #e5e7eb;

      padding: 10px;
      outline: none;

      font-weight: 800;
    }

    .mealField textarea {
      min-height: 80px;
      resize: vertical;

      font-weight: 600;
    }

    .mealDayTitle {
      color: #e5e7eb;

      font-weight: 950;

      margin: 14px 0 6px;
    }

    /* =========================================================
       MEAL TABLE
       ========================================================= */

    .mealScreenTableWrap {
      width: 100%;
      overflow: visible;
    }

    .mealScreenTable {
      width: 100%;

      border-collapse: collapse;
      table-layout: fixed;

      font-size: 8px;
      line-height: 1.02;
    }

    .mealScreenTable th,
    .mealScreenTable td {
      border: 1px solid rgba(148, 163, 184, .18);

      padding: 1px;

      text-align: center;

      color: #e5e7eb;

      white-space: nowrap;

      height: 17px;
    }

    .mealScreenTable th {
      background: #020617;

      color: #facc15;

      font-weight: 950;
      font-size: 8px;
    }

    .mealScreenTable td {
      background: #0b1120;

      font-weight: 800;
    }

    .mealScreenTable .m-sector {
      color: #facc15;
      font-weight: 950;
    }

    .mealScreenTable .m-team {
      text-align: center;

      overflow: hidden;
      text-overflow: ellipsis;

      font-size: 7px;

      max-width: 70px;
    }

    .mealScreenTable th:nth-child(1),
    .mealScreenTable td:nth-child(1) {
      width: 40px;
    }

    .mealScreenTable th:nth-child(n+3),
    .mealScreenTable td:nth-child(n+3) {
      width: 28px;
    }

    .mealScreenTable tfoot td {
      background: #1e293b;

      color: #facc15;

      font-weight: 950;

      height: 18px;
    }

    /* =========================================================
       TEAM POPUP
       ========================================================= */

    #teamPopup {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .9);

      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);

      z-index: 9999;

      align-items: center;
      justify-content: center;

      padding: 12px;
    }

    #teamPopupContent {
      background: #0f172a;

      border-radius: 15px;
      border: 1px solid #1f2937;

      max-width: 500px;
      width: 100%;

      max-height: 85vh;

      overflow-y: auto;

      box-shadow: 0 25px 50px rgba(0, 0, 0, .8);
    }

    #teamPopupHeader {
      padding: 12px;

      border-bottom: 1px solid #1f2937;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #teamPopupTitle {
      font-size: 1rem;
      font-weight: 800;

      color: #facc15;
    }

    #teamPopupClose {
      background: none;
      border: none;

      color: #94a3b8;

      font-size: 1.5rem;

      cursor: pointer;

      padding: 0;

      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 8px;

      transition: all .2s;
    }

    #teamPopupClose:hover {
      background: #1f2937;
      color: #e5e7eb;
    }

    #teamPopupBody {
      padding: 12px;
    }

    .team-loading {
      text-align: center;

      color: #94a3b8;

      padding: 16px;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .participation-page .footer {
      margin-top: 20px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 720px) {

      .wrap {
        padding: 10px 9px 40px;
      }

      .backRow {
        margin-bottom: 7px;
      }

      .btnBack {
        padding: 7px 11px;
        font-size: 11px;
      }

      .pageTitle {
        font-size: 1.3rem;
        margin: 8px 0 3px;
      }

      .pageSub {
        font-size: 11px;
        margin-bottom: 5px;
      }

      .list {
        margin-top: 2px;
      }

      .row {
        gap: 6px;
        padding: 7px 4px;
        min-height: 35px;
      }

      .lamp {
        width: 7px;
        height: 7px;
        flex-basis: 7px;
      }

      .idx {
        width: 23px;
        flex-basis: 23px;
        font-size: 12px;
      }

      .name {
        font-size: 12px;
        font-weight: 850;
      }

      .status {
        font-size: 10px;
      }

      .mealBox {
        padding: 9px;
        margin: 5px 0 7px;
      }

      .mealHead {
        flex-direction: column;
        gap: 5px;
      }

      .mealActions {
        width: 100%;
        gap: 5px;
      }

      .mealBtn {
        flex: 1 1 auto;

        padding: 7px 8px;

        font-size: 11px;
        min-height: 32px;
      }

      .mealGrid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 380px) {

      .row {
        gap: 5px;
        padding: 6px 3px;
        min-height: 33px;
      }

      .name {
        font-size: 11.5px;
      }

      .status {
        font-size: 9.5px;
      }

      .idx {
        width: 21px;
        flex-basis: 21px;
      }

      .pageTitle {
        font-size: 1.2rem;
      }
    }

  </style>
</head>
